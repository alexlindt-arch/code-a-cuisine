<section class="home" aria-labelledby="hero-title">
  <div class="content-limited">

    <div class="home-content">
      <div class="content-left">
        <header class="top-content">
          <p>AI-Powered <span class="keep-together">recipe generator</span></p>
          <h1 id="hero-title">Code à Cuisine</h1>
          <div class="button-content">
            <app-button [routerLink]="recipeRouterLink"></app-button>
          </div>
        </header>
        <aside class="bottom-section" aria-label="Cookbook">
          <p>Hungry for inspiration?</p>
          <app-routerlink-componente [targetClass]="'--light --hero'" [linkText]="'Go to cookbook'"
            [targetPath]="cookbookRouterLink"></app-routerlink-componente>
        </aside>
        <a [routerLink]="impressRouterLink" class="impressum-link">Imprint</a>
      </div>
      <div class="content-right" aria-hidden="true">
        <app-images-component [class]="heroImageClass" [src]="heroImageThree" label=""></app-images-component>
        <app-images-component [class]="heroImageClass" [src]="heroImageTwo" label=""></app-images-component>
        <app-images-component [class]="heroImageClass" [src]="heroImageOne" label=""></app-images-component>
        <app-images-component [class]="heroImageClass" [src]="heroImageFour" label=""></app-images-component>
        <app-images-component [class]="heroImageClass" [src]="heroImageFive" label=""></app-images-component>
      </div>
    </div>

  </div>
</section>
