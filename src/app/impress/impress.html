<section class="impressum" aria-labelledby="imprint-title">
  <div class="content-limited">
    <nav [attr.aria-label]="'cookbook.backHome' | t">
      <app-routerlink-componente [linkText]="homeLinkText" [targetClass]="homeTargetClass"
        [imageArrow]="homeImageArrow" [targetPath]="homeTargetPath" [ariaLabel]="homeAriaLabel | t"></app-routerlink-componente>
    </nav>
    <article class="impressum-content">
      <h1 id="imprint-title">{{ 'imprint.title' | t }}</h1>
      <p>{{ 'imprint.intro' | t }}</p>

      <h2>{{ 'imprint.responsible' | t }}</h2>
      <p>Alexander Lindt<br>
        {{ 'imprint.contactBefore' | t }}
        <a href="https://alexanderlindtwebdesign.com" target="_blank" rel="noopener noreferrer">alexanderlindtwebdesign.com</a>{{ 'imprint.contactAfter' | t }}</p>

      <h2>{{ 'imprint.source' | t }}</h2>
      <p>{{ 'imprint.sourceBefore' | t }}
        <a href="https://github.com/alexlindt-arch/code-a-cuisine" target="_blank" rel="noopener noreferrer">GitHub</a>{{ 'imprint.sourceAfter' | t }}</p>
    </article>
  </div>
</section>
